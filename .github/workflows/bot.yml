name: FEST GUARD Runner

on:
  workflow_dispatch:
  schedule:
    # Her 5 saatte bir botu otomatik olarak yeniden başlatır (7/24 açık kalması için)
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Paketleri Yükle
        run: npm install

      - name: Botu Başlat
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node index.js
        
